name: pull-request
on:
  pull_request:
    # `reopened`, `labeled`, `unlabeled`: the dep-changeset gate reads Renovate's labels,
    # which arrive in a second API call after the PR opens.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  code:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      # pnpm must be on PATH BEFORE setup-node: v5 reads `packageManager` from
      # package.json and invokes that manager, so the reverse order fails with
      # "Unable to locate executable file: pnpm". v4 did not, hence the old order.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # Clear npm exec cache to work around gherkin-cli npm cache corruption
      - name: Clear npm exec cache
        run: rm -rf ~/.npm/_npx

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install

      # Warm the gherkin-cli npx cache serially once, so the parallel `turbo verify`
      # tasks reuse a single install instead of racing to populate ~/.npm/_npx
      # concurrently (the ENOTEMPTY cache-corruption the clear step above guards against).
      - name: Warm gherkin-cli npx cache
        run: npx -y gherkin-cli@0.0.2 --help > /dev/null 2>&1 || true

      - run: pnpm verify

  # Renovate PRs: writes a patch changeset when the leak checks pass, or fails until a
  # person commits one. Passes on every other PR.
  dep-changeset:
    uses: repobuddy/.github/.github/workflows/dep-changeset.yml@v2
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      # Only packages/cyberplace is published; the root `pnpm build` would also build the
      # docs site for nothing.
      build-command: pnpm --filter cyberplace build

  # The Version Packages PR: fails when a package major goes up with no person-written
  # changeset asking for it. Skipped on every other PR.
  release-guard:
    uses: repobuddy/.github/.github/workflows/dep-changeset-release-guard.yml@v2
    permissions:
      contents: read
      pull-requests: read

  all-checks:
    if: always()
    needs: [code, dep-changeset, release-guard]
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE: ${{ needs.code.result }}
          GATE: ${{ needs.dep-changeset.result }}
          GUARD: ${{ needs.release-guard.result }}
        run: |
          [ "$CODE" = success ] || exit 1
          [ "$GATE" = success ] || exit 1
          [ "$GUARD" = success ] || [ "$GUARD" = skipped ] || exit 1
